[package]
name = "decklink-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Low-level C ABI bindings for Blackmagic DeckLink SDK 16.0"
links = "decklink_shim"
exclude = ["cxx/README.md"]

[lints]
workspace = true

[features]
default = []
# Compile the C++ shim against a local DeckLink SDK. Without this feature the
# crate still builds and exposes the same symbols as stubs.
hardware = []

[build-dependencies]
cc = "1.2"
