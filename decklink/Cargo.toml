[package]
name = "decklink"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Safe, cross-platform, runtime-agnostic DeckLink capture and playout"
readme = "../README.md"

[lints]
workspace = true

[features]
default = []
hardware = ["decklink-sys/hardware"]
wgpu = ["dep:wgpu"]
tokio = ["dep:tokio"]
tracing = ["dep:tracing"]

[dependencies]
bitflags.workspace = true
decklink-sys = { path = "../decklink-sys" }
futures-channel.workspace = true
futures-core.workspace = true
futures-sink.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }
wgpu = { version = "30.0.1", optional = true, default-features = false, features = ["std", "wgsl", "parking_lot"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
] }
ash = "0.38"
wgpu = { version = "30.0.1", optional = true, default-features = false, features = ["std", "wgsl", "parking_lot", "dx12", "vulkan"] }

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
wgpu = { version = "30.0.1", optional = true, default-features = false, features = ["std", "wgsl", "parking_lot", "vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "MTLBuffer",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
] }
wgpu = { version = "30.0.1", optional = true, default-features = false, features = ["std", "wgsl", "parking_lot", "metal"] }

[dev-dependencies]
futures-util.workspace = true
pollster = "0.4"
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[[example]]
name = "list_devices"

[[example]]
name = "async_capture"

[[example]]
name = "capture_stats"

[[example]]
name = "capture_frame"

[[example]]
name = "scheduled_playout"

[[example]]
name = "colorbars"

[[example]]
name = "wgpu_colorbars"
required-features = ["wgpu"]
