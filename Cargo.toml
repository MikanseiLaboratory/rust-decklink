[workspace]
resolver = "2"
members = ["decklink", "decklink-sys"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MikanseiLaboratory/rust-decklink"
authors = ["Mikansei Laboratory"]

[workspace.dependencies]
futures-channel = "0.3"
futures-core = "0.3"
futures-sink = "0.3"
futures-util = "0.3"
bitflags = "2"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }

[workspace.lints.rust]
missing_docs = "allow"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
